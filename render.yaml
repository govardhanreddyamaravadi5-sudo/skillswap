services:
  # Spring Boot Backend Web Service
  - type: web
    name: skillswap-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString

  # React Vite Frontend Static Site
  - type: web
    name: skillswap-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skillswap-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: skillswap-db
    plan: free
    databaseName: skillswap_db
    user: skillswap_user
    region: oregon
